<!doctype html>
<html lang="en" data-theme="lime">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Ironbook</title>
  <meta name="description" content="Personal workout tracker: plans, schedule, rest timer and strength progress.">
  <meta name="theme-color" content="#0D110E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ironbook">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="data/exercises.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply the saved theme before first paint (no flash)
    try { var t = localStorage.getItem('ironbook-theme'); if (t === 'lime' || t === 'glacier') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main id="view"></main>
  <nav id="tabbar"></nav>
  <noscript>Ironbook needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
